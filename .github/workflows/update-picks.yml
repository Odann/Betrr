name: Update picks

on:
  schedule:
    - cron: "7 15 * * *"
    - cron: "7 20 * * *"
    - cron: "37 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["odds-picks/docs/index.html", "odds-picks/styles/**", "odds-picks/tailwind.config.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-picks
  cancel-in-progress: false

# The project lives in the odds-picks folder of this repo
defaults:
  run:
    working-directory: odds-picks

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odds-picks/requirements.txt

      - name: Fetch odds, find picks, grade results
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          pip install -r requirements.txt
          python -m pipeline.update

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the stylesheet
        run: npx --yes tailwindcss@3 -i styles/input.css -o docs/styles.css --minify

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update picks"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: odds-picks/docs
      - id: deploy
        uses: actions/deploy-pages@v4
