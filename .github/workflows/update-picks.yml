name: Update picks

on:
  # Once a day at 3:07 PM Toronto time in winter (4:07 PM in summer); times are UTC.
  # Budget on the free 500 credits/month plan: 3 bet types x 3 sports = 9 credits
  # per run, plus 2 per sport when checking final scores, so roughly 400 a month.
  # A manual "Run workflow" costs about 9-15 credits. Adding a second daily run
  # would run out partway through the month.
  schedule:
    - cron: "7 20 * * *"
  workflow_dispatch:
    inputs:
      refresh_odds:
        description: "Fetch new odds (uses about 9 API credits). Untick to only republish the site."
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["odds-picks/docs/**", "odds-picks/styles/**", "odds-picks/tailwind.config.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-picks
  cancel-in-progress: false

# The project lives in the odds-picks folder of this repo
defaults:
  run:
    working-directory: odds-picks

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_odds)
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odds-picks/requirements.txt

      - name: Fetch odds, find picks, grade results
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          pip install -r requirements.txt
          python -m pipeline.update

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the stylesheet
        run: npx --yes tailwindcss@3 -i styles/input.css -o docs/styles.css --minify

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update picks"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: odds-picks/docs
      - id: deploy
        uses: actions/deploy-pages@v4
